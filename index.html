<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartShop Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        /* Custom scrollbar for a cleaner look */
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.3);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(156, 163, 175, 0.5);
        }
        /* Fade in animation for messages */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease forwards;
        }
    </style>
</head>
<body class="bg-gradient-to-tr from-slate-900 via-indigo-950 to-slate-900 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white/10 backdrop-blur-xl border border-white/10 rounded-3xl shadow-2xl flex flex-col overflow-hidden h-[620px]">
        
        <div class="px-6 py-5 bg-white/5 border-b border-white/10 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center text-white shadow-md shadow-indigo-500/20">
                    <i class="fa-solid fa-bag-shopping text-lg"></i>
                </div>
                <div>
                    <h1 class="text-white font-semibold text-base tracking-wide">SmartShop Assistant</h1>
                    <div class="flex items-center gap-1.5 mt-0.5">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                        <p class="text-xs text-slate-400 font-medium">Online — Powered by LLaMA 3.1</p>
                    </div>
                </div>
            </div>
            <button class="text-slate-400 hover:text-white transition-colors">
                <i class="fa-solid fa-ellipsis-vertical text-lg"></i>
            </button>
        </div>

        <div class="flex-1 overflow-y-auto p-6 space-y-4 custom-scrollbar" id="chatWindow">
            <div class="flex items-start gap-2.5 max-w-[85%] animate-fade-in">
                <div class="bg-white/10 text-slate-200 text-sm p-3.5 rounded-2xl rounded-tl-none shadow-sm border border-white/5 leading-relaxed">
                    👋 Hello! I'm your SmartShop Assistant. Ask me about delivery, returns, payments, or anything else!
                </div>
            </div>
        </div>

        <div class="p-4 bg-white/5 border-t border-white/10">
            <div class="relative flex items-center bg-white/10 border border-white/10 rounded-2xl focus-within:border-indigo-500/50 focus-within:ring-2 focus-within:ring-indigo-500/20 transition-all px-4 py-2">
                <input type="text" id="questionInput" placeholder="Type your message here..." 
                       class="w-full bg-transparent text-white placeholder-slate-400 text-sm outline-none pr-12 py-2" />
                
                <button onclick="sendMessage()" 
                        class="absolute right-2 top-1/2 -translate-y-1/2 bg-gradient-to-r from-indigo-500 to-purple-500 hover:from-indigo-600 hover:to-purple-600 text-white w-9 h-9 rounded-xl flex items-center justify-center shadow-lg shadow-indigo-500/20 active:scale-95 transition-all">
                    <i class="fa-solid fa-paper-plane text-sm"></i>
                </button>
            </div>
            
            <div class="text-center text-[10px] text-slate-500 mt-3 font-medium tracking-wider uppercase">
                SmartShop AI © 2026 — Ahmed Ullah Nihat
            </div>
        </div>

    </div>

    <script>
        const API_URL = "https://smartshop-assistant-basic-production.up.railway.app/chat";

        async function sendMessage() {
            const input = document.getElementById("questionInput");
            const question = input.value.trim();
            if (!question) return;

            addMessage(question, "user");
            input.value = "";
            addMessage("⏳ Thinking...", "bot thinking");

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({question: question})
                });
                const data = await response.json();
                removeLastMessage();
                addMessage(data.answer, "bot");
            } catch (error) {
                removeLastMessage();
                addMessage("❌ Error! Please try again.", "bot error");
            }
        }

        function addMessage(text, type) {
            const chatWindow = document.getElementById("chatWindow");
            const wrapper = document.createElement("div");
            
            // Apply different styles based on message type
            if (type === "user") {
                wrapper.className = "flex items-start justify-end max-w-[85%] ml-auto animate-fade-in";
                wrapper.innerHTML = `
                    <div class="bg-gradient-to-r from-indigo-500 to-purple-600 text-white text-sm p-3.5 rounded-2xl rounded-tr-none shadow-md shadow-indigo-500/10 leading-relaxed break-words">
                        ${text}
                    </div>
                `;
            } else if (type.includes("thinking")) {
                wrapper.className = "flex items-start gap-2.5 max-w-[85%] animate-fade-in text-slate-400 italic text-xs pl-2";
                wrapper.innerHTML = `<div>${text}</div>`;
            } else if (type.includes("error")) {
                wrapper.className = "flex items-start gap-2.5 max-w-[85%] animate-fade-in";
                wrapper.innerHTML = `
                    <div class="bg-rose-500/10 text-rose-300 border border-rose-500/20 text-sm p-3.5 rounded-2xl rounded-tl-none leading-relaxed">
                        ${text}
                    </div>
                `;
            } else {
                // Standard Bot Message
                wrapper.className = "flex items-start gap-2.5 max-w-[85%] animate-fade-in";
                wrapper.innerHTML = `
                    <div class="bg-white/10 text-slate-200 text-sm p-3.5 rounded-2xl rounded-tl-none shadow-sm border border-white/5 leading-relaxed break-words">
                        ${text}
                    </div>
                `;
            }

            chatWindow.appendChild(wrapper);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function removeLastMessage() {
            const chatWindow = document.getElementById("chatWindow");
            if (chatWindow.lastChild) {
                chatWindow.removeChild(chatWindow.lastChild);
            }
        }

        document.getElementById("questionInput")
            .addEventListener("keypress", function(e) {
                if (e.key === "Enter") {
                    e.preventDefault(); // Prevents default form submissions if any
                    sendMessage();
                }
            });
    </script>
</body>
</html>
